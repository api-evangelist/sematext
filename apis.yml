aid: sematext
name: Sematext
image: https://sematext.com/wp-content/uploads/2024/10/apps.sematext.com_ui_synthetics_38609_monitors_652_runs_MacBook-Pro-_13-1.webp
description: Sematext is an observability company offering Sematext Cloud, a SaaS
  platform for log management, infrastructure and application monitoring, tracing,
  synthetic monitoring and real user monitoring, with Elasticsearch-API-compatible
  log ingestion and search and professional Solr / Elasticsearch / OpenSearch support.
  Its Sematext Cloud REST API (v3) manages apps, tokens, alerts, subscriptions and
  billing, and is documented in a public Swagger API Explorer in US and EU regions.
