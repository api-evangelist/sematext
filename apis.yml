- aid: sematext:sematext-logs-api
  name: Sematext Logs API (Elasticsearch-compatible)
  description: >-
    Elasticsearch-API-compatible endpoint for indexing log events (including _bulk) and searching them,
    addressed by Logs App token. No standalone contract is published; it follows the Elasticsearch API.
  humanURL: https://sematext.com/docs/logs/index-events-via-sematext-api/
  baseURL: https://logsene-receiver.sematext.com
  tags:
  - Logging
  - Elasticsearch
  - Search
