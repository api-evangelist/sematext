apis:
- aid: sematext:sematext-cloud-api
  name: Sematext Cloud API
  description: REST API (Swagger 2.0, v3) for managing Sematext Cloud apps, app tokens,
    allowed IPs, alert rules, notifications, report subscriptions, billing plans,
    and Logs / Monitoring app creation and usage. Authenticated with an account API
    key in the Authorization header (apiKey <key>). EU region served at apps.eu.sematext.com.
  humanURL: https://sematext.com/docs/api/
  baseURL: https://apps.sematext.com
  tags:
  - Observability
  - Monitoring
  - Logging
  - Alerts
  properties:
  - type: OpenAPI
    url: openapi/sematext-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://apps.sematext.com/users-web/api-docs
  - type: APIReference
    url: https://apps.sematext.com/api-explorer
  - type: Documentation
    url: https://sematext.com/docs/api/
- aid: sematext:sematext-logs-api
  name: Sematext Logs API (Elasticsearch-compatible)
  description: Elasticsearch-API-compatible endpoint for indexing log events (including
    _bulk) and searching them, addressed by Logs App token. No standalone contract
    is published; it follows the Elasticsearch API.
  humanURL: https://sematext.com/docs/logs/index-events-via-sematext-api/
  baseURL: https://logsene-receiver.sematext.com
  tags:
  - Logging
  - Elasticsearch
  - Search
  properties:
  - type: Documentation
    url: https://sematext.com/docs/logs/index-events-via-sematext-api/
  - type: Documentation
    name: Search API
    url: https://sematext.com/docs/logs/search-through-the-sematext-api/
- aid: sematext:sematext-events-api
  name: Sematext Events API
  description: HTTP API for posting and searching events (deployments, alerts, other
    annotations) against an App token, correlated with metrics and logs in Sematext
    Cloud.
  humanURL: https://sematext.com/docs/events/event-api/
  baseURL: https://event-receiver.sematext.com
  tags:
  - Events
  - Observability
  properties:
  - type: Documentation
    url: https://sematext.com/docs/events/event-api/
