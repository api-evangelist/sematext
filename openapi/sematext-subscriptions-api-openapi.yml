    Subscription:
      type: object
      properties:
        additionalParams:
          type: string
        addresses:
          type: string
        createdBy:
          type: string
        dashboardId:
          type: integer
          format: int64
        dashboardName:
          type: string
        enabled:
          type: boolean
        filters:
          type: string
        frequency:
          type: string
          enum:
          - EVERY_FIVE_MINUTES
          - DAILY
          - WEEKLY
          - MONTHLY
          - QUARTERLY
        id:
          type: integer
          format: int64
        nextSendDate:
          type: string
          format: date-time
        subject:
          type: string
        systemId:
          type: integer
          format: int64
        systemName:
          type: string
        text:
          type: string
        timeRange:
          type: string
          enum:
          - ONE_DAY
          - ONE_WEEK
          - ONE_MONTH
          - TWO_MONTH
          - SIX_MONTH
          - ONE_YEAR
        userPermissions:
          $ref: '#/components/schemas/UserPermissions'
    SubscriptionsResponseEntry:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
    UpdateSubscriptionDto:
