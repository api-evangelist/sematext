        addresses:
          type: string
          description: Comma separated list of email addresses
        appId:
          type: integer
          format: int64
        endDate:
          type: string
          format: date-time
        filters:
          type: string
        reportName:
          type: string
        startDate:
          type: string
          format: date-time
        subject:
          type: string
        text:
