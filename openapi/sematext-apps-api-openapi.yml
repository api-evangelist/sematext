openapi: 3.2.0
info:
  title: Sematext Apps API
  version: v3
  description: 'Operations tagged Apps across 2 of this provider''s published API definitions: sematext-cloud-openapi-original.json, sematext-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Apps
paths:
  /users-web/api/v3/apps/types:
    get:
      tags:
      - Apps
      summary: Get all App types supported for the account identified with apiKey
      operationId: getAppTypesUsingGET
      responses:
        '200':
          description: 'Response data key: appTypes, Response data type: List of App types'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTypesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
  /users-web/api/v3/apps/{anyStateAppId}:
    get:
      tags:
      - Apps
      summary: Gets details for one particular App
      operationId: getUsingGET
      parameters:
      - name: anyStateAppId
        in: path
        description: anyStateAppId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Response data key: app, Response data type: App'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    put:
      tags:
      - Apps
      summary: Update app
      description: App can be in any state
      operationId: updateUsingPUT_1
      parameters:
      - name: anyStateAppId
        in: path
        description: App Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Response data key: app, Response data type: App'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppInfo'
        description: dto
        required: true
    delete:
      tags:
      - Apps
      summary: delete
      operationId: deleteUsingDELETE_1
      parameters:
      - name: anyStateAppId
        in: path
        description: anyStateAppId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generic_Map_Based_Api_Response'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - api_key:
        - global
  /users-web/api/v3/apps:
    get:
      tags:
      - Apps
      summary: Get all apps accessible by account identified with apiKey
      operationId: listUsingGET
      responses:
        '200':
          description: 'Response data key: apps, Response data type: List of Apps'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    post:
      tags:
      - Apps
      summary: Create Experience App
      operationId: createExperienceApp_1
      responses:
        '200':
          description: 'Response data key: apps, Response data type: List of Apps'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppInfo'
        description: Details of the application to be created
        required: true
  /users-web/api/v3/apps/users:
    get:
      tags:
      - Apps
      summary: Get all users of apps accessible to this account
      operationId: listAppsUsersUsingGET_1
      responses:
        '200':
          description: 'Response data key: apps, Response data type: List of Apps (with respective users)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
  /users-web/api/v3/apps/{anyStateAppId}/description:
    put:
      tags:
      - Apps
      summary: Update description of the app
      description: App can be in any state
      operationId: updateDescriptionUsingPUT
      parameters:
      - name: anyStateAppId
        in: path
        description: App Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Response data key: app, Response data type: App'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppDescription'
        description: Update Details
components:
  schemas:
    ServiceIntegration:
      type: object
      properties:
        appTypeId:
          type: integer
          format: int64
        appTypeName:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
        externalProductId:
          type: integer
          format: int64
        externalProductName:
          type: string
        id:
          type: integer
          format: int64
        integrationType:
          type: string
        ordinal:
          type: integer
          format: int32
        parentIntegrationId:
          type: integer
          format: int64
        sematextService:
          type: string
        visible:
          type: boolean
    App:
      type: object
      properties:
        ajaxThreshold:
          type: integer
          format: int64
        appType:
          type: string
        appTypeId:
          type: integer
          format: int64
        creatorEmail:
          type: string
        creditCardExpiry:
          type: string
        creditCardNumber:
          type: string
        description:
          type: string
        displayStatus:
          type: string
        firstDataSavedDate:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        infraAppId:
          type: integer
          format: int64
        integration:
          $ref: '#/components/schemas/ServiceIntegration'
        lastDataReceivedDate:
          type: integer
          format: int64
        lastDataSavedDate:
          type: integer
          format: int64
        loggedInUserAppRole:
          type: string
        monthlyInvoiceAccount:
          type: boolean
        name:
          type: string
        ownerEmail:
          type: string
        pageLoadThreshold:
          type: integer
          format: int64
        paymentMethodId:
          type: integer
          format: int64
        plan:
          $ref: '#/components/schemas/Plan'
        prepaidAccount:
          type: boolean
        readToken:
          type: string
        readWriteToken:
          type: string
        registrationDate:
          type: integer
          format: int64
        status:
          type: string
        token:
          type: string
        tokens:
          type: array
          items:
            type: string
        trialEndDate:
          type: integer
          format: int64
        urlGroupLimit:
          type: integer
          format: int32
        userRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        writeToken:
          type: string
    AppTypesResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AppTypesResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    AppTypesResponseEntry:
      type: object
      properties:
        appTypes:
          type: array
          items:
            type: string
    Generic_Map_Based_Api_Response:
      type: object
      properties:
        data:
          type: object
          properties: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
      description: Generic map based wrapper class for all API responses
    AppsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AppsResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    Plan:
      type: object
      properties:
        appType:
          type: string
        custom:
          type: boolean
        dataRetentionHours:
          type: number
        defaultTrialPlan:
          type: boolean
        freeTrialDays:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        maxAlerts:
          type: integer
          format: int64
        maxDailyEvents:
          type: integer
          format: int64
        name:
          type: string
        planScheme:
          type: string
          enum:
          - SPM_1_0
          - SPM_2_0
          - SEARCHENE_1_0
          - LOGSENE_1_0
          - LOGSENE_2_0
          - RUM_1_0
          - RUM_1_1
          - RUM_EA
          - SYNTHETICS_EA
          - SYNTHETICS_1_0
          - BUGZ_EA
          - TRACES_1_0
        sematextService:
          type: string
          enum:
          - LOGSENE
          - SPM
          - RUM
          - SYNTHETICS
          - TRACES
        trialPlan:
          type: boolean
    UpdateAppInfo:
      type: object
      properties:
        description:
          type: string
          example: New Description of App
        ignorePercentage:
          type: number
          format: double
          example: 1.0
        maxEvents:
          type: integer
          format: int64
          example: 1000
        maxLimitMB:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: New Name
        sampling:
          type: boolean
          example: false
        samplingPercentage:
          type: integer
          format: int32
          example: 10
        staggering:
          type: boolean
          example: false
        status:
          type: string
          example: ACTIVE
          enum:
          - ACTIVE
          - DISABLED
    UserRole:
      type: object
      properties:
        role:
          type: string
          enum:
          - MASTER_USER
          - SUPER_USER
          - OWNER
          - ADMIN
          - USER
          - DEMO
          - ANONYMOUS
        roleStatus:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
        userEmail:
          type: string
    AppResponseEntry:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/App'
    AppResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AppResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    CreateAppInfo:
      type: object
      properties:
        appType:
          type: string
          example: infra
        discountCode:
          type: string
        infraAppId:
          type: integer
          format: int64
        initialPlanId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: my-new-app
    AppsResponseEntry:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/App'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    AppDescription:
      type: object
      properties:
        description:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- sematext-cloud-openapi-original.json
- sematext-openapi.yml
