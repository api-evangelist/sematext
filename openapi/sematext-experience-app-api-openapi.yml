openapi: 3.2.0
info:
  title: Sematext Experience App API
  version: v3
  description: 'Operations tagged Experience App across 2 of this provider''s published API definitions: sematext-cloud-openapi-original.json, sematext-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Experience App
paths:
  /users-web/api/v3/apps:
    post:
      tags:
      - Experience App
      summary: Create Experience App
      operationId: createExperienceApp_1
      responses:
        '200':
          description: 'Response data key: apps, Response data type: List of Apps'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppInfo'
        description: Details of the application to be created
        required: true
components:
  schemas:
    ServiceIntegration:
      type: object
      properties:
        appTypeId:
          type: integer
          format: int64
        appTypeName:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
        externalProductId:
          type: integer
          format: int64
        externalProductName:
          type: string
        id:
          type: integer
          format: int64
        integrationType:
          type: string
        ordinal:
          type: integer
          format: int32
        parentIntegrationId:
          type: integer
          format: int64
        sematextService:
          type: string
        visible:
          type: boolean
    App:
      type: object
      properties:
        ajaxThreshold:
          type: integer
          format: int64
        appType:
          type: string
        appTypeId:
          type: integer
          format: int64
        creatorEmail:
          type: string
        creditCardExpiry:
          type: string
        creditCardNumber:
          type: string
        description:
          type: string
        displayStatus:
          type: string
        firstDataSavedDate:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        infraAppId:
          type: integer
          format: int64
        integration:
          $ref: '#/components/schemas/ServiceIntegration'
        lastDataReceivedDate:
          type: integer
          format: int64
        lastDataSavedDate:
          type: integer
          format: int64
        loggedInUserAppRole:
          type: string
        monthlyInvoiceAccount:
          type: boolean
        name:
          type: string
        ownerEmail:
          type: string
        pageLoadThreshold:
          type: integer
          format: int64
        paymentMethodId:
          type: integer
          format: int64
        plan:
          $ref: '#/components/schemas/Plan'
        prepaidAccount:
          type: boolean
        readToken:
          type: string
        readWriteToken:
          type: string
        registrationDate:
          type: integer
          format: int64
        status:
          type: string
        token:
          type: string
        tokens:
          type: array
          items:
            type: string
        trialEndDate:
          type: integer
          format: int64
        urlGroupLimit:
          type: integer
          format: int32
        userRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        writeToken:
          type: string
    AppsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AppsResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    Plan:
      type: object
      properties:
        appType:
          type: string
        custom:
          type: boolean
        dataRetentionHours:
          type: number
        defaultTrialPlan:
          type: boolean
        freeTrialDays:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        maxAlerts:
          type: integer
          format: int64
        maxDailyEvents:
          type: integer
          format: int64
        name:
          type: string
        planScheme:
          type: string
          enum:
          - SPM_1_0
          - SPM_2_0
          - SEARCHENE_1_0
          - LOGSENE_1_0
          - LOGSENE_2_0
          - RUM_1_0
          - RUM_1_1
          - RUM_EA
          - SYNTHETICS_EA
          - SYNTHETICS_1_0
          - BUGZ_EA
          - TRACES_1_0
        sematextService:
          type: string
          enum:
          - LOGSENE
          - SPM
          - RUM
          - SYNTHETICS
          - TRACES
        trialPlan:
          type: boolean
    UserRole:
      type: object
      properties:
        role:
          type: string
          enum:
          - MASTER_USER
          - SUPER_USER
          - OWNER
          - ADMIN
          - USER
          - DEMO
          - ANONYMOUS
        roleStatus:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
        userEmail:
          type: string
    AppsResponseEntry:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/App'
    CreateAppInfo:
      type: object
      properties:
        appType:
          type: string
          example: infra
        discountCode:
          type: string
        infraAppId:
          type: integer
          format: int64
        initialPlanId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: my-new-app
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- sematext-cloud-openapi-original.json
- sematext-openapi.yml
