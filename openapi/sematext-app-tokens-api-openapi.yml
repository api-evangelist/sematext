openapi: 3.2.0
info:
  title: Sematext App tokens API
  version: v3
  description: 'Operations tagged App tokens across 2 of this provider''s published API definitions: sematext-cloud-openapi-original.json, sematext-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: App tokens
paths:
  /users-web/api/v3/apps/{appId}/tokens/{tokenId}:
    put:
      tags:
      - App tokens
      summary: Update app token (enable/disable or name)
      operationId: updateAppToken_1
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      - name: tokenId
        in: path
        description: tokenId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Object with updated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTokenDto'
        description: dto
        required: true
    delete:
      tags:
      - App tokens
      summary: Delete app token
      operationId: deleteAppToken
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      - name: tokenId
        in: path
        description: tokenId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Status of operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generic_Map_Based_Api_Response'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - api_key:
        - global
  /users-web/api/v3/apps/{appId}/tokens:
    get:
      tags:
      - App tokens
      summary: Get app available tokens
      operationId: getAppTokens_1
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Response data contains read and write tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    post:
      tags:
      - App tokens
      summary: Create new app token
      operationId: createAppToken
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Response data contains object with new token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenDto'
        description: dto
        required: true
  /users-web/api/v3/apps/{appId}/tokens/{tokenId}/regenerate:
    post:
      tags:
      - App tokens
      summary: Regenerate app token)
      operationId: regenerateAppToken
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      - name: tokenId
        in: path
        description: tokenId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Object with updated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
components:
  schemas:
    TokenResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TokenResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    Generic_Map_Based_Api_Response:
      type: object
      properties:
        data:
          type: object
          properties: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
      description: Generic map based wrapper class for all API responses
    UpdateTokenDto:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
    TokensResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TokensResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    TokenResponseEntry:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/TokenDto'
    TokenDto:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: integer
          format: int64
        name:
          type: string
        readable:
          type: boolean
        token:
          type: string
        writeable:
          type: boolean
    TokensResponseEntry:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenDto'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    CreateTokenDto:
      type: object
      properties:
        name:
          type: string
        readable:
          type: boolean
        writeable:
          type: boolean
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- sematext-cloud-openapi-original.json
- sematext-openapi.yml
