securityDefinitions:
  api_key:
    type: apiKey
    name: Authorization
    in: header
definitions:
  AlertRuleScheduleTimeRangeDto:
    type: object
    properties:
      end:
        type: string
      start:
        type: string
  App:
    type: object
    properties:
      ajaxThreshold:
        type: integer
        format: int64
      appType:
        type: string
      appTypeId:
        type: integer
        format: int64
      creatorEmail:
        type: string
      creditCardExpiry:
        type: string
      creditCardNumber:
        type: string
      description:
        type: string
      displayStatus:
        type: string
      firstDataSavedDate:
        type: integer
        format: int64
      id:
        type: integer
        format: int64
      infraAppId:
        type: integer
        format: int64
      integration:
        $ref: '#/definitions/ServiceIntegration'
      lastDataReceivedDate:
        type: integer
        format: int64
      lastDataSavedDate:
        type: integer
        format: int64
      loggedInUserAppRole:
        type: string
      monthlyInvoiceAccount:
        type: boolean
      name:
        type: string
      ownerEmail:
        type: string
      pageLoadThreshold:
        type: integer
        format: int64
      paymentMethodId:
        type: integer
        format: int64
      plan:
        $ref: '#/definitions/Plan'
      prepaidAccount:
        type: boolean
      readToken:
        type: string
      readWriteToken:
        type: string
      registrationDate:
        type: integer
        format: int64
      status:
        type: string
      token:
        type: string
      tokens:
        type: array
        items:
          type: string
      trialEndDate:
        type: integer
        format: int64
      urlGroupLimit:
        type: integer
        format: int32
      userRoles:
        type: array
        items:
          $ref: '#/definitions/UserRole'
      writeToken:
        type: string
  Invoice:
    type: object
    properties:
      allCharges:
        type: array
        items:
          $ref: '#/definitions/ChargesDetailsResponseDto'
      invoiceDate:
        type: string
      invoiceId:
        type: string
      period:
        type: string
      service:
        type: string
      totalAmount:
        type: number
  AppTypesResponse:
    type: object
    properties:
      data:
        $ref: '#/definitions/AppTypesResponseEntry'
      errors:
        type: array
        items:
          $ref: '#/definitions/Error'
      message:
        type: string
      success:
        type: boolean
  ServiceIntegration:
    type: object
    properties:
      appTypeId:
        type: integer
        format: int64
      appTypeName:
        type: string
      displayName:
        type: string
      enabled:
        type: boolean
      externalProductId:
        type: integer
        format: int64
      externalProductName:
        type: string
      id:
        type: integer
        format: int64
      integrationType:
        type: string
      ordinal:
        type: integer
        format: int32
      parentIntegrationId:
        type: integer
        format: int64
      sematextService:
        type: string
      visible:
        type: boolean
  PlansResponseEntry:
    type: object
    properties:
      availablePlans:
        type: array
        items:
          $ref: '#/definitions/Plan'
  AppsResponseEntry:
    type: object
    properties:
      apps:
        type: array
        items:
          $ref: '#/definitions/App'
  AlertRulesResponseEntry:
    type: object
    properties:
      alertRules:
        type: array
        items:
          $ref: '#/definitions/AlertRule'
  MinPeriodFeePeriod:
    type: object
    properties:
      browserMonitors:
        type: integer
        format: int32
      discount:
        type: number
      fromDate:
        type: string
        format: date-time
      httpMonitors:
        type: integer
        format: int32
      id:
        type: integer
        format: int64
      ingestionPeriodFeeAmount:
        type: number
      minPeriodFeeAmount:
        type: number
      overagePercentage:
        type: number
      planDataLimit:
        type: integer
        format: int64
      storagePeriodFeeAmount:
        type: number
      toDate:
        type: string
        format: date-time
      usedPlan:
        type: string
      usedPlanPeriodFee:
        type: number
  IPDto:
    type: object
    properties:
      id:
        type: integer
        format: int64
      ip:
        type: string
  MailReportResponseResponseEntry:
    type: object
    properties:
      subscription:
        $ref: '#/definitions/ReportInfo'
  ChargesDetailsResponseDto:
    type: object
    properties:
      app:
        $ref: '#/definitions/App'
      chargeBase:
        type: string
        enum:
        - SUMMARIZED_USAGE
        - MIN_MONTHLY_FEE
        - SUM_OF_DAILY_FEES
        - TOTAL_MONTHLY_FEE
      dayUsageData:
        type: array
        items:
          $ref: '#/definitions/DayUsageData'
      monthlyFeeAmount:
        type: number
      periodFeePeriods:
        type: array
        items:
          $ref: '#/definitions/MinPeriodFeePeriod'
      totalAmount:
        type: number
      usageAmount:
        type: number
  SubscriptionResponse:
    type: object
    properties:
      data:
        $ref: '#/definitions/SubscriptionResponseEntry'
      errors:
        type: array
        items:
          $ref: '#/definitions/Error'
      message:
        type: string
      success:
        type: boolean
  CreateTokenDto:
    type: object
    properties:
      name:
        type: string
      readable:
        type: boolean
      writeable:
        type: boolean
  Subscription:
    type: object
    properties:
      additionalParams:
        type: string
      addresses:
        type: string
      createdBy:
        type: string
      dashboardId:
        type: integer
        format: int64
      dashboardName:
        type: string
      enabled:
        type: boolean
      filters:
        type: string
      frequency:
        type: string
        enum:
        - EVERY_FIVE_MINUTES
        - DAILY
        - WEEKLY
        - MONTHLY
        - QUARTERLY
      id:
        type: integer
        format: int64
      nextSendDate:
        type: string
        format: date-time
      subject:
        type: string
      systemId:
        type: integer
        format: int64
      systemName:
        type: string
      text:
        type: string
      timeRange:
        type: string
        enum:
        - ONE_DAY
        - ONE_WEEK
        - ONE_MONTH
        - TWO_MONTH
        - SIX_MONTH
        - ONE_YEAR
      userPermissions:
        $ref: '#/definitions/UserPermissions'
  CreateAppInfo:
    type: object
    properties:
      appType:
        type: string
        example: infra
      discountCode:
        type: string
      infraAppId:
        type: integer
        format: int64
      initialPlanId:
        type: integer
        format: int64
        example: 1
      name:
        type: string
        example: my-new-app
  SubscriptionDto:
    type: object
    properties:
      additionalParams:
        type: string
      addresses:
        type: string
      enable:
        type: boolean
      filters:
        type: string
      frequency:
        type: string
        enum:
        - EVERY_FIVE_MINUTES
        - DAILY
        - WEEKLY
        - MONTHLY
        - QUARTERLY
      id:
        type: integer
        format: int64
      reportName:
        type: string
      sendTime:
        type: string
        format: date-time
      subject:
        type: string
      systemId:
        type: integer
        format: int64
      text:
        type: string
      timeRange:
        type: string
        enum:
        - ONE_DAY
        - ONE_WEEK
        - ONE_MONTH
        - TWO_MONTH
        - SIX_MONTH
        - ONE_YEAR
      userPermissions:
        $ref: '#/definitions/UserPermissions'
  AlertRule:
    type: object
    properties:
      accountEmail:
        type: string
        readOnly: true
      allowedAppTypes:
        type: array
        items:
          type: integer
          format: int64
      analyzingTime:
        type: string
      appDisplayState:
        type: string
        readOnly: true
      appId:
        type: integer
        format: int64
      appName:
        type: string
        readOnly: true
      appState:
        type: string
        readOnly: true
      appToken:
        type: string
        readOnly: true
      appType:
        type: string
        readOnly: true
      backToNormalNeeded:
        type: boolean
      chartKey:
        type: string
      color:
