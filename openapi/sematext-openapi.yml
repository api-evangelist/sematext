swagger: '2.0'
info:
  description: 'API Explorer provides access and documentation for Sematext REST API.
    The REST API requires the API Key to be sent as part of `Authorization` header.
    E.g.: `Authorization : apiKey e5f18450-205a-48eb-8589-7d49edaea813`.'
  version: v3
  title: Sematext Cloud API
schemes:
- https
- http
paths:
  /users-web/api/v3/apps/{appId}/tokens/{tokenId}:
    put:
      tags:
      - App tokens
      summary: Update app token (enable/disable or name)
      operationId: updateAppToken_1
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        type: integer
        format: int64
      - name: tokenId
        in: path
        description: tokenId
        required: true
        type: integer
        format: int64
      - in: body
        name: dto
        description: dto
        required: true
        schema:
          $ref: '#/definitions/UpdateTokenDto'
      responses:
        '200':
          description: Object with updated token
          schema:
            $ref: '#/definitions/TokenResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    delete:
      tags:
      - App tokens
      summary: Delete app token
      operationId: deleteAppToken
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        type: integer
        format: int64
      - name: tokenId
        in: path
        description: tokenId
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: Status of operation
          schema:
            $ref: '#/definitions/Generic Map Based Api Response'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - api_key:
        - global
  /users-web/api/v3/apps/{appId}/tokens:
    get:
      tags:
      - App tokens
      summary: Get app available tokens
      operationId: getAppTokens_1
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: Response data contains read and write tokens
          schema:
            $ref: '#/definitions/TokensResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    post:
      tags:
      - App tokens
      summary: Create new app token
      operationId: createAppToken
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        type: integer
        format: int64
      - in: body
        name: dto
        description: dto
        required: true
        schema:
          $ref: '#/definitions/CreateTokenDto'
      responses:
        '200':
          description: Response data contains object with new token
          schema:
            $ref: '#/definitions/TokenResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
  /users-web/api/v3/apps/{token}/ips/{ipId}:
    put:
      tags:
      - App IPs
      summary: Replace an authorized source IP of a Logs App
      description: The new IP is added before the old one is removed. Alias tokens
        need write permission.
      operationId: updateAppIp
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: token
        in: path
        description: App token or an enabled token alias
        required: true
        type: string
      - name: ipId
        in: path
        description: Id of the IP to replace
        required: true
        type: integer
        format: int64
      - in: body
        name: dto
        description: dto
        required: true
        schema:
          $ref: '#/definitions/IPDto'
      responses:
        '200':
          description: 'Response data key: ip, Response data type: {id, ip} of the
            new IP'
          schema:
            $ref: '#/definitions/Generic Map Based Api Response'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
    delete:
      tags:
      - App IPs
      summary: Revoke an authorized source IP of a Logs App
      description: Alias tokens need write permission.
      operationId: deleteAppIp
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: token
        in: path
        description: App token or an enabled token alias
        required: true
        type: string
      - name: ipId
        in: path
        description: Id of the IP to revoke
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: Status of operation
          schema:
            $ref: '#/definitions/Generic Map Based Api Response'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - api_key:
        - global
  /users-web/api/v3/notifications/integrations/{updateableNotificationIntegrationId}/disable:
