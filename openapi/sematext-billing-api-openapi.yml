          - SPM_1_0
          - SPM_2_0
          - SEARCHENE_1_0
          - LOGSENE_1_0
          - LOGSENE_2_0
          - RUM_1_0
          - RUM_1_1
          - RUM_EA
          - SYNTHETICS_EA
          - SYNTHETICS_1_0
          - BUGZ_EA
          - TRACES_1_0
        sematextService:
          type: string
          enum:
          - LOGSENE
          - SPM
          - RUM
          - SYNTHETICS
          - TRACES
        trialPlan:
          type: boolean
    MinPeriodFeePeriod:
