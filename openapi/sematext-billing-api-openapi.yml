        browserMonitors:
          type: integer
          format: int32
        discount:
          type: number
        fromDate:
          type: string
          format: date-time
        httpMonitors:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        ingestionPeriodFeeAmount:
