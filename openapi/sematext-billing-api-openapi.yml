        lastDataReceivedDate:
          type: integer
          format: int64
        lastDataSavedDate:
          type: integer
          format: int64
        loggedInUserAppRole:
          type: string
        monthlyInvoiceAccount:
          type: boolean
        name:
          type: string
        ownerEmail:
          type: string
        pageLoadThreshold:
          type: integer
          format: int64
        paymentMethodId:
          type: integer
          format: int64
        plan:
