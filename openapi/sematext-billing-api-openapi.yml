        readWriteToken:
          type: string
        registrationDate:
          type: integer
          format: int64
        status:
          type: string
        token:
          type: string
        tokens:
          type: array
          items:
            type: string
        trialEndDate:
          type: integer
          format: int64
        urlGroupLimit:
