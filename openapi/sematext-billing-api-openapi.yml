            $ref: '#/components/schemas/DayUsageData'
        monthlyFeeAmount:
          type: number
        periodFeePeriods:
          type: array
          items:
            $ref: '#/components/schemas/MinPeriodFeePeriod'
        totalAmount:
          type: number
        usageAmount:
          type: number
