openapi: 3.2.0
info:
  title: Sematext Billing API
  version: v3
  description: 'Operations tagged Billing across 2 of this provider''s published API definitions: sematext-cloud-openapi-original.json, sematext-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Billing
paths:
  /users-web/api/v3/billing/availablePlans:
    get:
      tags:
      - Billing
      summary: Get available plans
      operationId: listAvailablePlansUsingGET_1
      parameters:
      - name: integrationId
        in: query
        description: integrationId
        required: false
        schema:
          type: integer
          format: int64
      - name: appType
        in: query
        description: appType
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Response data key: availablePlans, Response data type: List of Plans'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
  /users-web/api/v3/billing/invoice/{service}/{year}/{month}:
    get:
      tags:
      - Billing
      summary: Get invoice details
      operationId: getDetailedInvoiceUsingGET
      parameters:
      - name: service
        in: path
        description: service
        required: true
        schema:
          type: string
      - name: year
        in: path
        description: year
        required: true
        schema:
          type: integer
          format: int32
      - name: month
        in: path
        description: month
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'Response data key: invoice, Response data type: Invoice'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
  /users-web/api/v3/billing/info/{appId}:
    put:
      tags:
      - Billing
      summary: Update plan for an app
      operationId: updatePlanUsingPUT_1
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePlanResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInfo'
        description: dto
        required: true
components:
  schemas:
    UpdatePlanResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UpdatePlanResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    PlansResponseEntry:
      type: object
      properties:
        availablePlans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    EventDto:
      type: object
      properties:
        from:
          type: object
          properties: {}
        to:
          type: object
          properties: {}
        type:
          type: string
          enum:
          - CREATED
          - DISABLED
          - DELETED
          - REACTIVATED
          - PLAN_UPDATE
          - PAYMENT_METHOD_UPDATE
          - SEND_EMAIL_CHANGE
          - AUTOMATIC_PLAN_UPGRADE_CHANGE
          - MAX_LIMIT_CHANGE
          - SAMPLING_CHANGE
          - OWNERSHIP_CHANGE
          - OWNERSHIP_ACCEPT
          - OWNERSHIP_START
          - OWNERSHIP_CANCEL
          - OWNERSHIP_DECLINE
          - PIPELINE_CREATE
          - PIPELINE_CHANGE
          - PIPELINE_DELETE
          - TRIAL_END_DATE_CHANGE
          - ALERT_RULE_CREATE
          - BULK_ALERT_RULE_CREATE
          - ALERT_RULE_STATUS_CHANGE
          - ALERT_RULE_DELETE
          - ALERT_RULE_CHANGE
          - SYNTHETICS_MONITOR_CREATE
          - SYNTHETICS_MONITOR_UPDATE
          - SYNTHETICS_MONITOR_DISABLE
          - SYNTHETICS_MONITOR_ENABLE
          - SYNTHETICS_MONITOR_DELETE
          - SYNTHETICS_CICD_MONITOR_CREATE
          - SYNTHETICS_CICD_MONITOR_UPDATE
          - SYNTHETICS_CICD_MONITOR_DISABLE
          - SYNTHETICS_CICD_MONITOR_ENABLE
          - SYNTHETICS_CICD_MONITOR_DELETE
          - SYNTHETICS_MONITOR_TYPE_CHANGE
          - AUTO_MONITORING_ENABLE
          - AUTO_MONITORING_DISABLE
          - AUTO_MONITORING_DESTINATION_APP_CHANGE
          - AUTO_LOGS_ENABLE
          - AUTO_LOGS_DISABLE
          - AUTO_LOGS_DESTINATION_APP_CHANGE
          - APP_GUEST_ADDED
          - APP_GUEST_REMOVE
          - APP_GUEST_ROLE_CHANGE
          - AI_AGENT_MONITORING_ENABLE
          - AI_AGENT_MONITORING_DISABLE
    Invoice:
      type: object
      properties:
        allCharges:
          type: array
          items:
            $ref: '#/components/schemas/ChargesDetailsResponseDto'
        invoiceDate:
          type: string
        invoiceId:
          type: string
        period:
          type: string
        service:
          type: string
        totalAmount:
          type: number
    BillingInfo:
      type: object
      properties:
        creditCardId:
          type: integer
          format: int64
        maxLimit:
          type: integer
          format: int64
        maxLimitSpans:
          type: integer
          format: int64
        paymentMethod:
          type: string
        planId:
          type: integer
          format: int64
    InvoiceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InvoiceResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    Plan:
      type: object
      properties:
        appType:
          type: string
        custom:
          type: boolean
        dataRetentionHours:
          type: number
        defaultTrialPlan:
          type: boolean
        freeTrialDays:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        maxAlerts:
          type: integer
          format: int64
        maxDailyEvents:
          type: integer
          format: int64
        name:
          type: string
        planScheme:
          type: string
