openapi: 3.2.0
info:
  title: Sematext Logs App usage API
  version: v3
  description: 'Operations tagged Logs App usage across 2 of this provider''s published API definitions: sematext-cloud-openapi-original.json, sematext-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Logs App usage
paths:
  /logsene-reports/api/v3/apps/{appId}/usage/{from}/{to}:
    get:
      tags:
      - Logs App usage
      summary: getForRange
      operationId: getForRangeUsingGET
      parameters:
      - name: appId
        in: path
        description: appId
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: path
        description: from
        required: true
        schema:
          type: integer
          format: int64
      - name: to
        in: path
        description: to
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Get Info about Logs App usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - api_key:
        - global
components:
  schemas:
    UsageResponseEntry:
      type: object
      properties:
        usage:
          $ref: '#/components/schemas/UsageDto'
    UsageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UsageResponseEntry'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        message:
          type: string
        success:
          type: boolean
    DailyDto:
      type: object
      properties:
        day:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        ingestedCount:
          type: integer
          format: int64
        ingestedVolume:
          type: integer
          format: int64
        storedCount:
          type: integer
          format: int64
        storedVolume:
          type: integer
          format: int64
    UsageDto:
      type: object
      properties:
        dailyUsage:
          type: array
          items:
            $ref: '#/components/schemas/DailyDto'
        dailyVolumeMB:
          type: integer
          format: int64
        end:
          type: string
          format: date-time
        failedCount:
          type: integer
          format: int64
        ingestedCount:
          type: integer
          format: int64
        ingestedVolume:
          type: integer
          format: int64
        limitChangeEvents:
          type: array
          items:
            $ref: '#/components/schemas/LimitChangeEventDTO'
        maxAllowedMB:
          type: integer
          format: int64
        maxLimitMB:
          type: integer
          format: int64
        start:
          type: string
          format: date-time
        storedCount:
          type: integer
          format: int64
        storedVolume:
          type: integer
          format: int64
        volumeChangeEvents:
          type: array
          items:
            $ref: '#/components/schemas/LimitChangeEventDTO'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    LimitChangeEventDTO:
      type: object
      properties:
        eventTime:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        newLimit:
          type: integer
          format: int64
        oldLimit:
          type: integer
          format: int64
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- sematext-cloud-openapi-original.json
- sematext-openapi.yml
